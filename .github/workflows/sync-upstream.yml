name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.REPO_SCOPED_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Sync with upstream
        id: sync_step
        run: |
          git remote add upstream https://github.com/LNReader/lnreader-plugins.git || true
          git fetch upstream master
          LOCAL_BEFORE=$(git rev-parse HEAD)
          git rebase upstream/master
          LOCAL_AFTER=$(git rev-parse HEAD)
          if [ "$LOCAL_BEFORE" != "$LOCAL_AFTER" ]; then
            echo "Changes detected from upstream. Pushing to origin/master..."
            git push --force-with-lease origin master
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date with upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Publish Plugins
        if: steps.sync_step.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN || github.token }}
        run: |
          gh workflow run publish-plugins.yml --ref master || echo "Publish workflow trigger skipped or not permitted"
